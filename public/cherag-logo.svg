<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="flameGradient" x1="256" y1="100" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring/Glow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="2" />
  
  <!-- Lamp Base (Stylized) -->
  <path d="M176 368 C176 368, 160 416, 144 432 C144 432, 192 448, 256 448 C320 448, 368 432, 368 432 C352 416, 336 368, 336 368" 
        fill="none" stroke="#e4e4e7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Main Flame -->
  <path d="M256 64 
           C256 64, 336 192, 336 272 
           C336 325, 296 368, 256 368 
           C216 368, 176 325, 176 272 
           C176 192, 256 64, 256 64 Z" 
        fill="url(#flameGradient)" filter="url(#glow)" />
        
  <!-- Inner Flame Detail -->
  <path d="M256 128 
           C256 128, 296 224, 296 272 
           C296 300, 276 320, 256 320 
           C236 320, 216 300, 216 272 
           C216 224, 256 128, 256 128 Z" 
        fill="#ffffff" fill-opacity="0.6" />
        
</svg>
